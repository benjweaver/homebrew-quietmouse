name: Update formula

# Points the formula at the latest quietmouse release, then tests it.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/update-formula.sh
      - name: Commit and test if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The formula already points at the latest release."
            exit 0
          fi
          tag=$(gh release view --repo benjweaver/quietmouse --json tagName -q .tagName)
          version=${tag#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quietmouse $version"
          git push
          # Pushes made with this token don't trigger workflows, so start the tests explicitly.
          gh workflow run test.yml --ref "$GITHUB_REF_NAME"
