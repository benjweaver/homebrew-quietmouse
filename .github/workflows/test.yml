name: Test

# Checks the formula's style, then installs and tests it on macOS and Linux.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew with this tap
        uses: Homebrew/actions/setup-homebrew@main
      # brew style on the whole tap would hold the POSIX sh update script to
      # Homebrew's Bash conventions, so it checks the formula and shellcheck
      # checks the script.
      - run: brew style benjweaver/quietmouse/quietmouse
      - name: Lint the update script
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh "$(brew --repository benjweaver/quietmouse)/scripts/update-formula.sh"
      - run: brew audit --strict benjweaver/quietmouse/quietmouse
      - run: brew install benjweaver/quietmouse/quietmouse
      - run: brew test benjweaver/quietmouse/quietmouse
